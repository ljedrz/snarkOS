[package]
name = "snarkos"
version = "2.0.2"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/AleoHQ/snarkOS"
keywords = [
    "aleo",
    "cryptography",
    "blockchain",
    "decentralized",
    "zero-knowledge"
]
categories = [ "cryptography", "operating-systems" ]
license = "GPL-3.0"
edition = "2021"

[workspace]
members = [
    "account",
    "cli",
    "display",
    "node",
    "node/executor",
    "node/ledger",
    "node/messages",
    "node/rest",
    "node/router",
    "node/store"
]

#[lib]
#path = "snarkos/lib.rs"

[[bin]]
name = "snarkos"
path = "snarkos/main.rs"

[workspace.dependencies.snarkvm]
# path = "../snarkvm"
git = "https://github.com/AleoHQ/snarkVM.git"
rev = "70c0428"
features = ["circuit", "console", "parallel"]

[dependencies.anyhow]
version = "1"

[dependencies.clap]
version = "3.2"
features = ["derive"]

[dependencies.snarkos-account]
path = "./account"

[dependencies.snarkos-cli]
path = "./cli"

[dependencies.snarkos-display]
path = "./display"

[dependencies.snarkos-node]
path = "./node"

[dependencies.snarkos-node-executor]
path = "./node/executor"

[dependencies.snarkos-node-ledger]
path = "./node/ledger"

[dependencies.snarkos-node-messages]
path = "./node/messages"

[dependencies.snarkos-node-rest]
path = "./node/rest"

[dependencies.snarkos-node-router]
path = "./node/router"

[dependencies.snarkos-node-store]
path = "./node/store"

[dev-dependencies.async-trait]
version = "0.1"

[dev-dependencies.deadline]
version = "0.2"

[dev-dependencies.futures-util]
version = "0.3"
features = ["sink"]

[dev-dependencies.parking_lot]
version = "0.12"

[dev-dependencies.pea2pea]
version = "0.40"

[dev-dependencies.rusty-hook]
version = "0.11.2"

[dev-dependencies.snarkvm]
workspace = true

[dev-dependencies.tokio]
version = "1"
features = ["io-util", "macros", "net", "parking_lot", "rt", "sync", "time"]

[dev-dependencies.tokio-util]
version = "0.7"
features = ["codec"]

[dev-dependencies.tracing]
version = "0.1"

[dev-dependencies.tracing-subscriber]
version = "0.3"
default-features = false
features = ["ansi", "env-filter", "fmt", "parking_lot", "smallvec"]

[build-dependencies.walkdir]
version = "2"

[profile.release]
opt-level = 3
lto = "thin"
incremental = true

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 2
lto = "thin"
incremental = true

[profile.test]
opt-level = 2
lto = "thin"
incremental = true
debug = true
debug-assertions = true
